<svg xmlns="http://www.w3.org/2000/svg" width="280" height="373" viewBox="0 0 280 373">
  <rect width="280" height="373" fill="#EFEAE0"/>
  <rect x="0" y="0" width="280" height="373" fill="url(#grain)" opacity="0.04"/>
  <defs>
    <pattern id="grain" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/></filter>
      <rect width="300" height="300" filter="url(#n)"/>
    </pattern>
  </defs>
  <!-- Silhouette avvocato stilizzata -->
  <circle cx="140" cy="120" r="52" fill="#D4C9B5"/>
  <ellipse cx="140" cy="290" rx="80" ry="60" fill="#D4C9B5"/>
  <!-- Toga decorativa -->
  <rect x="100" y="195" width="80" height="8" rx="2" fill="#6B1E22" opacity="0.6"/>
  <!-- Testo -->
  <text x="140" y="345" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#4A4550" text-anchor="middle" letter-spacing="1">AVV. GIUSEPPE CUOMO</text>
  <text x="140" y="362" font-family="Georgia, serif" font-size="10" fill="#9B7D35" text-anchor="middle" letter-spacing="2">CASSAZIONISTA</text>
</svg>
